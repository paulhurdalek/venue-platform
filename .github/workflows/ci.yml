name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: venue_test
          POSTGRES_PASSWORD: venue_test_local_only
          POSTGRES_USER: venue
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://venue:venue_test_local_only@localhost:5433/venue_test
      TEST_DATABASE_URL: postgresql://venue:venue_test_local_only@localhost:5433/venue_test
      CORS_ORIGINS: http://localhost:3100
      LOG_LEVEL: warn
      SWAGGER_UI_ENABLED: 'false'
      API_BASE_URL: http://localhost:3101
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3101
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test:db
      - run: pnpm test:e2e
      - run: pnpm security:audit

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:containers
