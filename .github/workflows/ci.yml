name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: venue_test
          POSTGRES_PASSWORD: venue_test_local_only
          POSTGRES_USER: venue
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://venue:venue_test_local_only@localhost:5433/venue_test
      TEST_DATABASE_URL: postgresql://venue:venue_test_local_only@localhost:5433/venue_test
      CORS_ORIGINS: http://localhost:3100
      WEB_PUBLIC_URL: http://localhost:3100
      AUTH_PUBLIC_BASE_URL: http://localhost:3100
      AUTH_INTERNAL_BASE_URL: http://localhost:3101
      BETTER_AUTH_SECRET: test-only-secret-never-use-in-production-1234567890
      SESSION_DURATION_SECONDS: '3600'
      PASSWORD_MIN_LENGTH: '10'
      BOOTSTRAP_TOKEN_TTL_SECONDS: '600'
      INVITATION_TTL_SECONDS: '3600'
      RATE_LIMIT_WINDOW_SECONDS: '60'
      RATE_LIMIT_MAX_REQUESTS: '100'
      AUTH_SIGN_IN_RATE_LIMIT_MAX: '20'
      SENSITIVE_RATE_LIMIT_MAX: '50'
      LOG_LEVEL: warn
      SWAGGER_UI_ENABLED: 'false'
      API_BASE_URL: http://localhost:3101
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test:db
      - run: pnpm test:e2e
      - run: pnpm security:audit

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24.18.0
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:containers
