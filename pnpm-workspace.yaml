packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: true

# Temporary security patch until @nestjs/swagger raises its js-yaml pin.
overrides:
  '@nestjs/swagger>js-yaml': 5.2.3
  # Remove once a stable Prisma release uses deepmerge-ts >= 8 itself.
  '@prisma/config>deepmerge-ts': 8.0.0

catalog:
  '@nestjs/common': 11.1.29
  '@nestjs/core': 11.1.29
  '@nestjs/platform-express': 11.1.29
  '@types/node': 24.13.3
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  typescript: 5.9.3
  vitest: 4.1.10
